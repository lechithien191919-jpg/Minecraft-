<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft 3D v0.2 - Mobile</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair">+</div>
    
    <div id="ui-container">
        <div id="block-selector">Đang chọn: <span id="current-block-name">Cỏ</span></div>
    </div>

    <!-- Joystick ảo cho di động -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- Nút bấm hành động trên màn hình cảm ứng -->
    <div id="action-buttons">
        <div class="action-btn" id="btn-switch">ĐỔI</div>
        <div class="action-btn" id="btn-place">ĐẶT</div>
        <div class="action-btn" id="btn-break">ĐẬP</div>
    </div>

    <!-- Các module JavaScript -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
